
<div class="change-password-page">
  <h2>Change Password</h2>
  <p class="subtitle">Update your password to keep your account secure.</p>

  <section class="password-card">
    <h3>Password Settings</h3>
    <p class="card-description">Enter your current password and choose a new one.</p>

    <div *ngIf="errorMessage" class="message-error" role="alert">
      {{ errorMessage }}
    </div>

    <div *ngIf="successMessage" class="message-success" role="status">
      {{ successMessage }}
    </div>

    <form (ngSubmit)="changePassword()" #passwordForm="ngForm">
      <div class="form-field">
        <label for="currentPassword">Current Password</label>
        <div class="password-input">
          <input
            id="currentPassword"
            name="currentPassword"
            [type]="showCurrentPassword ? 'text' : 'password'"
            [(ngModel)]="currentPassword"
            required
            placeholder="Enter current password"
          />
          <button
            type="button"
            class="toggle-password"
            (click)="showCurrentPassword = !showCurrentPassword"
            [attr.aria-label]="showCurrentPassword ? 'Hide current password' : 'Show current password'"
          >
            {{ showCurrentPassword ? 'Hide' : 'Show' }}
          </button>
        </div>
      </div>
        <div class="form-field">
        <label for="newPassword">New Password</label>

        <div class="password-input">
            <input
            id="newPassword"
            name="newPassword"
            [type]="showNewPassword ? 'text' : 'password'"
            [(ngModel)]="newPassword"
            required
            minlength="8"
            placeholder="Enter new password"
            />

            <button
            type="button"
            class="toggle-password"
            (click)="showNewPassword = !showNewPassword"
            >
            {{ showNewPassword ? 'Hide' : 'Show' }}
            </button>
        </div>

        <small class="field-hint">
            Minimum 8 characters.
        </small>

        <small
            class="field-error"
            *ngIf="newPassword.length > 0 && newPassword.length < 8"
        >
            Password must contain at least 8 characters.
        </small>
        </div>
      <div class="form-field">
        <label for="confirmPassword">Confirm New Password</label>
        <div class="password-input">
          <input
            id="confirmPassword"
            name="confirmPassword"
            [type]="showConfirmPassword ? 'text' : 'password'"
            [(ngModel)]="confirmPassword"
            required
            minlength="8"
            placeholder="Re-enter new password"
          />
          <button
            type="button"
            class="toggle-password"
            (click)="showConfirmPassword = !showConfirmPassword"
            [attr.aria-label]="showConfirmPassword ? 'Hide confirmation password' : 'Show confirmation password'"
          >
            {{ showConfirmPassword ? 'Hide' : 'Show' }}
          </button>
        </div>
      </div>

      <div class="actions">
        <button
          type="submit"
          [disabled]="passwordForm.invalid || isSaving"
        >
          {{ isSaving ? 'Changing...' : 'Change Password' }}
        </button>
      </div>
    </form>
  </section>
</div>
